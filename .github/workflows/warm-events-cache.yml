name: Warm events cache

on:
  schedule:
    # GitHub Actions cron schedules are evaluated in UTC.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TZ: UTC
    steps:
      - name: Fetch the public events API and warm its cache
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            'https://prywoz.fm/api/events.php?limit=100' \
            --output "$response_file"

          python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)

          if not isinstance(payload, dict):
              raise SystemExit("Events API response must be a JSON object")
          if not isinstance(payload.get("updatedAt"), str) or not payload["updatedAt"]:
              raise SystemExit("Events API response is missing updatedAt")
          if not isinstance(payload.get("events"), list):
              raise SystemExit("Events API response is missing the events array")
          providers = payload.get("providers")
          if not isinstance(providers, dict) or not providers:
              raise SystemExit("Events API response is missing provider status")
          for provider_name in ("ticketmaster", "poznan"):
              provider = providers.get(provider_name)
              if not isinstance(provider, dict):
                  raise SystemExit(f"Events API response is missing {provider_name} status")
              if not isinstance(provider.get("connected"), bool):
                  raise SystemExit(f"Events API response has invalid {provider_name}.connected")
              if not isinstance(provider.get("status"), str):
                  raise SystemExit(f"Events API response has invalid {provider_name}.status")

          print(
              "Events cache warmed; "
              f"events={len(payload['events'])}, "
              f"providers={','.join(name for name, state in providers.items() if state.get('connected'))}"
          )
          PY
